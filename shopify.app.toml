# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a5ab6f6f606ad74191cdc0f60370c0ad"
name = "adiy-payment-plans"
application_url = "https://adiy-payment-plans.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_all_orders, read/write_own_subscription_contracts and read_customer_payment_methods are
# protected scopes: they need approval in the Partner Dashboard before they work on the live store.
scopes = "write_products,read_purchase_options,write_purchase_options,read_own_subscription_contracts,write_own_subscription_contracts,read_customer_payment_methods,read_orders,write_orders,read_all_orders,read_customers,read_inventory,write_inventory,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_draft_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = [ "orders/updated", "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscriptions"
  topics = [ "subscription_contracts/create", "subscription_billing_attempts/success", "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://adiy-payment-plans.onrender.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
