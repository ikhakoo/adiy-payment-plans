# Render Blueprint: app server + Postgres + hourly charge job.
# In Render: New → Blueprint → pick this repo. Fill the `sync: false` values when prompted.

databases:
  - name: adiy-payment-plans-db
    plan: basic-256mb
    databaseName: adiy_payment_plans
    user: adiy

services:
  - type: web
    name: adiy-payment-plans
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    # `setup` runs `prisma migrate deploy` before the server starts.
    startCommand: npm run docker-start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adiy-payment-plans-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL # e.g. https://plans.a-diy.com
        sync: false
      - key: SCOPES
        value: write_products,read_purchase_options,write_purchase_options,read_own_subscription_contracts,write_own_subscription_contracts,read_customer_payment_methods,read_orders,write_orders,read_all_orders,read_customers,read_inventory,write_inventory,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_draft_orders,read_discounts,write_discounts

  # Every hour: settle charges in flight and start any that are due. Each run is idempotent.
  - type: cron
    name: adiy-payment-plans-charges
    runtime: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SHOPIFY_APP_URL/jobs/charges"'
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: adiy-payment-plans
          envVarKey: CRON_SECRET
      - key: SHOPIFY_APP_URL
        sync: false
